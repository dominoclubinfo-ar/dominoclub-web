<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Domino Club</title>
    <style>
        /* Estilos minimalistas y ligeros para la pantalla de carga */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0f172a; /* Color de fondo oscuro elegante */
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
        }
        #app-loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .loading-title {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 0.05em;
        }
        .loading-subtitle {
            font-size: 0.875rem;
            color: #94a3b8;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        /* Ocultar la pantalla de carga una vez arranca Compose */
        .loaded #app-loading {
            display: none;
        }
    </style>
    <!-- Carga tu script generado por Kotlin Multiplatform -->
    <script type="text/javascript" src="composeApp.js" defer></script>
</head>
<body>
<div id="app-loading">
    <div class="spinner"></div>
    <div class="loading-title">Domino Club</div>
    <div class="loading-subtitle">Cargando experiencia multijugador...</div>
</div>

<!-- Contenedor donde se montará Compose Multiplatform -->
<div id="root"></div>

<script>
    // Opcional: Detectar cuando el canvas o la app principal inicie para remover el splash
    window.addEventListener("kotlinAppStarted", function() {
        document.body.classList.add("loaded");
    });
</script>
</body>
</html>
