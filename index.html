<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <!--
        Sin esta etiqueta, los navegadores móviles usan un viewport virtual de
        ~980px y luego escalan la página para que quepa: la app se ve pequeña y
        "alejada". Con width=device-width Compose recibe el ancho real del
        teléfono y la interfaz se adapta.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>Domino Club</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0f172a; /* Color de fondo oscuro elegante */
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff;
            overflow: hidden;
            overscroll-behavior: none;
        }

        /* En móviles, 100dvh sigue el alto visible real (barra del navegador
           incluida) y evita que el canvas quede cortado o con huecos. */
        @supports (height: 100dvh) {
            html, body {
                height: 100dvh;
            }
        }

        /* Compose monta su canvas directamente en <body>. */
        body canvas {
            display: block;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Pantalla de carga superpuesta hasta que Compose agrega su canvas. */
        #app-loading {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .loading-title {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 0.05em;
        }
        .loading-subtitle {
            font-size: 0.875rem;
            color: #94a3b8;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        /* Oculta la pantalla de carga una vez arranca Compose */
        .loaded #app-loading {
            display: none;
        }

        /* Error visible cuando el navegador no puede arrancar Kotlin/Wasm o
           cuando falla la descarga del bundle. Antes quedaba solo el spinner. */
        #app-error {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            box-sizing: border-box;
            background-color: #0f172a;
        }
        #app-error[hidden] {
            display: none;
        }
        .error-card {
            max-width: 560px;
            width: 100%;
            text-align: center;
        }
        .error-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .error-detail {
            font-size: 0.9375rem;
            line-height: 1.5;
            color: #cbd5e1;
            word-break: break-word;
        }
    </style>

    <script>
        /*
         * Arranque controlado del bundle Kotlin/Wasm.
         *
         * 1) Quita service workers viejos del origen (quedaron del sitio de
         *    publicidad y pueden servir index.html/js desactualizados en iOS).
         * 2) Comprueba WebAssembly GC antes de cargar composeApp.js. Sin ese
         *    soporte Kotlin/Wasm nunca ejecuta main() y antes quedaba el splash
         *    girando para siempre.
         * 3) Muestra el error en pantalla en vez de dejar la página en blanco.
         */
        (function () {
            var fatalShown = false;
            var appStartMark = Date.now();

            function showFatal(title, detail) {
                if (fatalShown) return;
                fatalShown = true;
                document.body.classList.add("loaded");

                var box = document.getElementById("app-error");
                if (!box) {
                    box = document.createElement("div");
                    box.id = "app-error";
                    (document.body || document.documentElement).appendChild(box);
                }

                box.textContent = "";

                var card = document.createElement("div");
                card.className = "error-card";

                var heading = document.createElement("div");
                heading.className = "error-title";
                heading.textContent = title;

                var text = document.createElement("div");
                text.className = "error-detail";
                text.textContent = detail;

                card.appendChild(heading);
                card.appendChild(text);
                box.appendChild(card);
                box.hidden = false;
            }

            function supportsKotlinWasm() {
                if (!window.WebAssembly || !WebAssembly.validate) return false;

                try {
                    // Módulo mínimo con un tipo struct: detecta WebAssembly GC.
                    var gcBytes = new Uint8Array([
                        0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 95, 1, 120, 0
                    ]);
                    if (!WebAssembly.validate(gcBytes)) return false;

                    // composeApp.js crea un Tag con externref al arrancar.
                    if (!WebAssembly.JSTag && typeof WebAssembly.Tag !== "function") {
                        return false;
                    }
                    if (typeof WebAssembly.Tag === "function") {
                        new WebAssembly.Tag({ parameters: ["externref"] });
                    }
                    return true;
                } catch (e) {
                    return false;
                }
            }

            function cleanupStaleServiceWorker() {
                if (!("serviceWorker" in navigator)) return Promise.resolve(false);

                var hadController = !!navigator.serviceWorker.controller;

                return navigator.serviceWorker.getRegistrations()
                    .then(function (registrations) {
                        return Promise.all(registrations.map(function (registration) {
                            return registration.unregister();
                        }));
                    })
                    .then(function () {
                        if (!window.caches || !caches.keys) return hadController;
                        return caches.keys()
                            .then(function (keys) {
                                return Promise.all(keys.map(function (key) {
                                    return caches.delete(key);
                                }));
                            })
                            .then(function () { return hadController; });
                    })
                    .catch(function () { return hadController; });
            }

            function reloadOnceAfterCleanup() {
                var key = "dc-sw-cleanup-reloaded";
                try {
                    if (sessionStorage.getItem(key)) return false;
                    sessionStorage.setItem(key, "1");
                } catch (e) {
                    // Modo privado: si no hay storage, recargamos una sola vez
                    // de todas formas porque el service worker ya fue dado de baja.
                }
                location.reload();
                return true;
            }

            function loadComposeApp() {
                var script = document.createElement("script");
                script.src = "composeApp.js";
                script.async = false;
                script.onerror = function () {
                    showFatal(
                        "No se pudo cargar la aplicación",
                        "No se pudo descargar composeApp.js. Revisá tu conexión y volvé a intentar."
                    );
                };
                document.head.appendChild(script);

                // Si Wasm arranca pero la composición falla, el canvas puede
                // quedar vacío. Mostramos el fallo también en ese caso.
                var ticks = 0;
                var watchdog = setInterval(function () {
                    if (document.querySelector("canvas")) {
                        clearInterval(watchdog);
                        return;
                    }
                    ticks++;
                    if (ticks >= 40) {
                        clearInterval(watchdog);
                        showFatal(
                            "Domino Club no terminó de iniciar",
                            "El navegador descargó la aplicación pero no se creó la pantalla. " +
                            "Cerrá la pestaña y volvé a abrirla. Si vuelve a pasar, " +
                            "actualizá iOS y Safari a la última versión."
                        );
                    }
                }, 500);
            }

            function describeConsoleArg(value) {
                if (value && value.stack) return String(value.stack);
                if (typeof value === "string") return value;
                try { return JSON.stringify(value); } catch (e) { return String(value); }
            }

            // Compose/Kotlin pueden capturar una excepción y mandarla solo a la
            // consola. En iOS no hay consola visible, así que la levantamos al
            // mismo overlay para saber por qué quedó el canvas vacío.
            function captureConsoleError(method, filterLog) {
                if (!window.console || typeof console[method] !== "function") return;
                var original = console[method];
                console[method] = function () {
                    var text = Array.prototype.map.call(arguments, describeConsoleArg).join(" ");
                    if (/Exception|TypeError|ReferenceError|Uncaught|Cannot read|is not a function|failed/i.test(text) &&
                        (!filterLog || /Kotlin|Compose|Wasm|Exception|PreloadEmojiFont|kmauth/i.test(text))) {
                        showFatal(
                            "No se pudo dibujar Domino Club",
                            method.toUpperCase() + ": " + text.substring(0, 1200)
                        );
                    }
                    return original.apply(console, arguments);
                };
            }

            function start() {
                captureConsoleError("error", false);
                captureConsoleError("warn", true);
                captureConsoleError("log", true);

                window.addEventListener("error", function (event) {
                    // Durante el arranque mostramos cualquier error, incluso si
                    // el canvas ya existe: una composición que falla deja el
                    // canvas vacío y antes parecía una pantalla azul.
                    if (Date.now() - appStartMark > 60000 && document.querySelector("canvas")) return;
                    showFatal(
                        "No se pudo iniciar Domino Club",
                        (event && event.message) || "Error desconocido al cargar la aplicación."
                    );
                });

                window.addEventListener("unhandledrejection", function (event) {
                    if (Date.now() - appStartMark > 60000 && document.querySelector("canvas")) return;
                    var reason = event && event.reason;
                    showFatal(
                        "No se pudo iniciar Domino Club",
                        (reason && reason.message) || String(reason || "Error desconocido al cargar la aplicación.")
                    );
                });

                cleanupStaleServiceWorker().then(function (hadController) {
                    if (hadController && reloadOnceAfterCleanup()) return;

                    if (!supportsKotlinWasm()) {
                        showFatal(
                            "Domino Club necesita una versión más nueva",
                            "Este navegador no soporta WebAssembly GC, requerido por la aplicación. " +
                            "En iPhone/iPad actualizá iOS a 18.2 o superior (Safari 18.2+). " +
                            "Todos los navegadores de iOS usan el mismo motor, así que Chrome y Firefox " +
                            "también dependen de la versión de iOS. Si ya tenés iOS 18.2+, cerrá la " +
                            "pestaña y volvé a abrirla."
                        );
                        return;
                    }

                    loadComposeApp();
                });
            }

            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", start);
            } else {
                start();
            }
        })();
    </script>
</head>
<body>
<div id="app-loading">
    <div class="spinner"></div>
    <div class="loading-title">Domino Club</div>
    <div class="loading-subtitle">Cargando experiencia multijugador...</div>
</div>

<div id="app-error" hidden></div>

<script>
    // Compose agrega su <canvas> al arrancar. En cuanto aparece, ocultamos el
    // splash (el evento "kotlinAppStarted" ya no lo emite ComposeViewport).
    (function () {
        function hideSplashIfReady() {
            if (document.querySelector("canvas")) {
                document.body.classList.add("loaded");
                observer.disconnect();
                return true;
            }
            return false;
        }

        var observer = new MutationObserver(hideSplashIfReady);
        observer.observe(document.body, { childList: true, subtree: true });

        // Por si el canvas ya existía antes de registrar el observer.
        hideSplashIfReady();
    })();
</script>
</body>
</html>
